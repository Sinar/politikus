[buildout]

extends = buildout.cfg
parts += zeoserver
         instance0
         instance1
         instance2
         instance3

auto-checkout =

[sources]
politikus.contenttypes = git https://github.com/Sinar/politikus.contenttypes.git branch=plone5
popolo.contenttypes = git https://github.com/Sinar/popolo.contenttypes.git branch=plone5
ocds.contenttypes = git https://github.com/Sinar/ocds.contenttypes.git branch=plone5
politikus.bods = git https://github.com/Sinar/politikus.bods.git branch=plone5
politikus.theme = git https://github.com/Sinar/politikus.theme.git branch=plone5
collective.vocabularies.iso = git https://github.com/Sinar/collective.vocabularies.iso branch=plone5
politikus.extractives = git https://github.com/Sinar/politikus.extractives branch=plone5
politikus.naturalresource = git https://github.com/Sinar/politikus.naturalresource branch=plone5
plone.app.z3cform = git https://github.com/enfold/plone.app.z3cform tag=3.2.2+enfold1

[instance0]
<= instance
zeo-address = ${zeoserver:zeo-address}
zeo-client = on
shared-blob = on

[instance1]
<= instance0
http-address = 8081

[instance2]
<= instance0
http-address = 8083

[instance3]
<= instance0
http-address = 8083





[zeoserver]
recipe = plone.recipe.zeoserver
zeo-address = 8100
file-storage = ${buildout:directory}/var/filestorage/Data.fs
blob-storage = ${buildout:directory}/var/blobstorage/
user = ${buildout:user}
pack-days = 30

